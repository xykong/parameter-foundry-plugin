<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">From declared inputs to a validated build</title><desc id="desc">UI, Pipeline, REST and CLI use type-specific decoding. Choice and form inputs share server-side evaluation, governed Providers supply options, and files use a separate bounded upload lifecycle. Accepted values reach builds and Rebuild.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#68dce8" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="520" rx="20" fill="#0b1829"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="48" y="48" font-size="14" letter-spacing="3" fill="#68dce8">ONE DEFINITION. EXPLICIT CONTRACTS.</text><text x="48" y="94" font-size="31" font-weight="700" fill="#f3f7ff">From intent to a validated build</text>
<g fill="#12263c" stroke="#35506b"><rect x="48" y="160" width="230" height="166" rx="12"/><rect x="345" y="160" width="400" height="166" rx="12"/><rect x="812" y="160" width="340" height="166" rx="12"/><rect x="345" y="375" width="400" height="95" rx="12"/></g>
<g fill="#f3f7ff" font-size="23" font-weight="700"><text x="72" y="198">Declare &amp; submit</text><text x="370" y="198">Decode → evaluate</text><text x="837" y="198">Build with known values</text><text x="370" y="411">Governed Providers</text></g>
<g fill="#b9cce0" font-size="18"><text x="72" y="236">Jenkins UI · Pipeline</text><text x="72" y="267">REST · CLI</text><text x="72" y="298">Type-specific transports</text><text x="370" y="236">Choices &amp; forms: validation, defaults</text><text x="370" y="267">Snapshots where required</text><text x="370" y="298">Files: bounded upload lifecycle</text><text x="837" y="236">Typed or legacy string values</text><text x="837" y="267">Configured environment export</text><text x="837" y="298">Retained values → Rebuild</text><text x="370" y="444">Profiles · limits · cache · dependencies</text></g>
<g stroke="#68dce8" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M278 242H333"/><path d="M745 242H800"/><path d="M545 375V338"/></g>
<text x="48" y="385" fill="#f6b76b" font-size="16">Compatibility is explicit.</text><text x="48" y="415" fill="#9cb4cd" font-size="16">Input shape and defaults</text><text x="48" y="440" fill="#9cb4cd" font-size="16">follow the selected mode.</text><text x="812" y="394" fill="#9cb4cd" font-size="16">A conceptual model of the implemented</text><text x="812" y="419" fill="#9cb4cd" font-size="16">contracts, not a network topology.</text>
</g></svg>
