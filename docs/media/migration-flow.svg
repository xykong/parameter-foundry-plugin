<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">Migration is an evidence workflow</title><desc id="desc">Inventory and preview, decide and apply, compare builds, inspect history, and retire only after review. A source plugin remains needed while historical or generated references remain.</desc><rect width="1200" height="320" rx="20" fill="#0b1829"/><g font-family="Arial,Helvetica,sans-serif"><text x="42" y="46" fill="#68dce8" font-size="14" letter-spacing="3">MIGRATE WITH EVIDENCE</text><text x="42" y="90" fill="#f3f7ff" font-size="29" font-weight="700">Configuration parity is only the beginning.</text><g fill="#142a40" stroke="#35506b"><rect x="42" y="130" width="250" height="100" rx="10"/><rect x="330" y="130" width="250" height="100" rx="10"/><rect x="618" y="130" width="250" height="100" rx="10"/><rect x="906" y="130" width="250" height="100" rx="10"/></g><g fill="#f3f7ff" font-size="21" font-weight="700"><text x="62" y="167">01  Inspect</text><text x="350" y="167">02  Apply</text><text x="638" y="167">03  Compare</text><text x="926" y="167">04  Review history</text></g><g fill="#b9cce0" font-size="16"><text x="62" y="202">Inventory · classified preview</text><text x="350" y="202">Decisions · diff · rollback</text><text x="638" y="202">Values · exports · consumers</text><text x="926" y="202">Readers · generators · retention</text></g><g fill="#68dce8" font-size="28"><text x="300" y="190">›</text><text x="588" y="190">›</text><text x="876" y="190">›</text></g><text x="42" y="279" fill="#f6b76b" font-size="18">Retire only after workflow verification. File history remains a separate development gate.</text></g></svg>
