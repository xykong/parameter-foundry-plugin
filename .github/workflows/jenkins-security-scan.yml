# More information about the Jenkins security scan can be found at the developer docs: https://www.jenkins.io/redirect/jenkins-security-scan/
---
name: Jenkins Security Scan
on:
  push:
    branches:
      - "master"
      - "main"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  security-scan:
    # Code scanning needs GitHub Advanced Security while this repository is
    # private, and its absence fails the upload step. The job starts running as
    # soon as the repository is public, where code scanning is free.
    if: ${{ !github.event.repository.private }}
    uses: jenkins-infra/jenkins-security-scan/.github/workflows/jenkins-security-scan.yaml@v2
    with:
      java-cache: 'maven'  # Optionally enable use of a build dependency cache. Specify 'maven' or 'gradle' as appropriate.
      # java-version: 21  # Optionally specify what version of Java to set up for the build, or remove to use a recent default.
