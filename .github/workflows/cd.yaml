# Derived from jenkinsci/.github workflow-templates/cd.yaml.
# Hosting, CI acceptance, and release permissions must be configured first.
---
name: cd
on:
  workflow_dispatch:
    inputs:
      validate_only:
        required: false
        type: boolean
        description: Validate and draft release notes without publishing
        default: true

permissions:
  checks: read
  contents: write

jobs:
  maven-cd:
    if: github.repository_owner == 'jenkinsci'
    uses: jenkins-infra/github-reusable-workflows/.github/workflows/maven-cd.yml@c2470861b1ad94810dc0d207b011e0b57bb91bbb # v1
    with:
      validate_only: ${{ inputs.validate_only == true }}
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
