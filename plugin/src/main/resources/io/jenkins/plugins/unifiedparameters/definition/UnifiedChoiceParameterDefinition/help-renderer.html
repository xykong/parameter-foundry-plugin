<div>
  <p>How options are offered:</p>
<ul>
  <li>single: <code>select</code>, <code>searchable</code>, <code>radio</code>, or a trusted
  external Renderer ID.</li>
  <li>multiple: <code>list</code>, <code>checkbox</code>, <code>table</code>, or a trusted
  external Renderer ID.</li>
</ul>
<p>Every renderer shares one server-side evaluation path, so switching the renderer never changes
the submitted value.</p>
</div>
