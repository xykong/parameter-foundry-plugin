MigrationDecisionEditableChoice1=どのカスタム値が正当な業務入力かを確認し、範囲を限定した正規表現／長さポリシーを定義してください。
MigrationDecisionEditableChoice2=カスタム値を正規値として永続化するのか、1 回のビルドのみに使うのかを確認してください。
MigrationDecisionEditableChoice3=重複、空値、既定値、Rebuild、API の扱いを移行元の動作と比較してください。
MigrationReasonExtensibleChoice=Extensible Choice の Provider ベースまたは静的選択肢設定には、ガバナンスされた Provider マッピングが必要です。このアダプターは定義クラスのみを検査し、ソースコードを実行しません。
MigrationDecisionExtensibleChoice1=静的な Inline オプションかガバナンスされた Provider を選んでください。レビューされていない provider 実装をコピーしないでください。
MigrationDecisionExtensibleChoice2=単一／複数選択の基数、順序、既定値、空値、無効、Provider 利用不可時の動作を確認してください。
MigrationDecisionExtensibleChoice3=外部ソースと資格情報は、管理者が管理する Connection Profile でバインドしてください。
MigrationReasonRestList=REST List は、Connection Profile と範囲を限定した解析を伴うガバナンスされた REST JSON/XML Provider に対応します。このアダプターは定義クラスのみを検査し、ソースコードを実行しません。
MigrationDecisionRestList1=権限、パスの許可リスト、資格情報、タイムアウト、レスポンスサイズ、リダイレクトポリシーを Connection Profile でバインドしてください。
MigrationDecisionRestList2=レスポンスの value/label パスを、範囲を限定した JSONPath/XPath サブセットにマッピングしてください。
MigrationDecisionRestList3=SSRF ポリシー、コンテンツタイプ、空値／エラー／フォールバック、依存クエリ値、スナップショットの動作を検証してください。
MigrationReasonValidatingString=Validating String は、サーバー側で範囲を限定した検証を伴う Unified Form の型付き文字列フィールドに対応します。このアダプターは定義クラスのみを検査し、ソースコードを実行しません。
MigrationDecisionValidatingString1=移行元の検証式を安全な正規表現／長さのサブセットに変換するか、手動再設計として報告してください。
MigrationDecisionValidatingString2=検証のタイミング、エラーメッセージ、必須／空値／既定値の動作、秘密情報の扱いを確認してください。
MigrationDecisionValidatingString3=標準、Typed API、CLI、Pipeline、リモート、Rebuild のエラーコードの同等性を検証してください。
MigrationReasonJsonEditor=JSON Editor は任意のエディターウィジェットではなく、型付きの Unified Form Schema に対応します。このアダプターは定義クラスのみを検査し、ソースコードを実行しません。
MigrationDecisionJsonEditor1=利用する JSON Schema のサブセットを確認し、未対応の実行可能／エディター拡張を拒否してください。
MigrationDecisionJsonEditor2=Pipeline 出力として Map と JSON 文字列のどちらを選ぶか、およびフィールドから環境変数への明示的なマッピングを決めてください。
MigrationDecisionJsonEditor3=ネストしたオブジェクト／配列、必須／型／範囲、未知フィールド、正規シリアライズの動作を検証してください。
MigrationReasonJsonParameter=JSON Parameter と JSON Parameter Reference は型付きの Provider/Form 契約に対応します。このアダプターは定義クラスのみを検査し、ソースコードを実行しません。
MigrationDecisionJsonParameter1=構造化データと参照駆動の選択肢検出を分離し、Provider と Form のどちらにするかを選んでください。
MigrationDecisionJsonParameter2=コア内で移行元スクリプトを実行せずに、JSONPath／参照依存のセマンティクスを確認してください。
MigrationDecisionJsonParameter3=schema／型／既定値／空値／未知フィールド、依存の再取得、構造化出力の同等性を検証してください。
MigrationReasonStashedFile=Stashed File はオプション パラメーターではなく multipart／ファイル転送の機能です。ADR 0015 はそのネイティブ転送の維持を求めています。
MigrationDecisionStashedFile1=業務要件がファイルのアップロードである場合は、ネイティブの Stashed File パラメーターを維持してください。
MigrationDecisionStashedFile2=この Job またはその生成元が Stashed File を必要とする間は、File Parameters プラグインを無効化しないでください。
MigrationDecisionStashedFile3=要件が内容のアップロードではなくファイル風オプションの選択である場合は、ガバナンスされた Provider/Form フィールドとして再設計してください。
MigrationDecisionStashedFile4=stash 名、ワークスペース／ファイルの保持、資格情報、リモートトリガー、Rebuild の動作を個別に検証してください。
MigrationCaseAdditional={0} について、ブラウザー、標準 REST、Typed API、CLI、Pipeline／上流、リモート／webhook、Rebuild、既定値、空値、不正値、タイムアウト、データソース利用不可時の動作を検証してください。
MigrationCaseStashedFile={0} について、ネイティブの multipart 送信、stash のライフサイクル、下流のファイルアクセス、ファイル欠落エラー、リモート／上流の動作、Rebuild を、選択値に変換せずに検証してください。
