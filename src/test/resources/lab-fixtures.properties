# Synthetic defaults for values that differ between the public repository and a
# maintainer's lab. Public builds use this file; an internal run points
# PF_LAB_FIXTURES at a file with the same keys holding the real values.
#
# See docs/decisions/0018-public-hygiene-and-private-lab-overlay.md.

# Container registries used by the matrix and login fixtures.
registry.primary=registry.example.com
registry.primary.label=Registry A
registry.secondary=harbor.example.net
registry.secondary.label=Registry B
registry.tertiary=swr.example.cloud
registry.tertiary.label=Registry C
registry.quaternary=registry.example.net
registry.quaternary.label=Registry D
registry.quinary=registry.example.org
registry.quinary.label=Registry E

# Build nodes.
node.builtin=built-in
agent.primary=agent-a.example.net
agent.secondary=agent-b.example.net
