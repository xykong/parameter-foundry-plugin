<div>
  <p>How many values the parameter submits:</p>
<ul>
  <li><code>single</code> returns one <code>String</code>, or <code>null</code> when optional and
  left empty.</li>
  <li><code>multiple</code> returns an unordered, deterministic <code>List</code>; no selection is
  an empty list.</li>
</ul>
<p>The mode decides which renderers are valid and how the value is exported to the
environment.</p>
</div>
